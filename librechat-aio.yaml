version: 1.1.6

cache: true

# interface:
#   privacyPolicy:
#     externalUrl: 'https://librechat.ai/privacy-policy'
#     openNewTab: true
#   termsOfService:
#     externalUrl: 'https://librechat.ai/tos'
#     openNewTab: true

registration:
  socialLogins: ["discord", "facebook", "github", "google", "openid"]

endpoints:
  custom:
    # groq
    # Model list: https://console.groq.com/settings/limits
    - name: "groq"
      apiKey: "user_provided"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default: [
          "deepseek-r1-distill-llama-70b",
          "deepseek-r1-distill-qwen-32b",
          "gemma2-9b-it",
          "llama-3.1-8b-instant",
          "llama-3.2-11b-vision-preview",
          "llama-3.2-1b-preview",
          "llama-3.2-3b-preview",
          "llama-3.2-90b-vision-preview",
          "llama-3.3-70b-specdec",
          "llama-3.3-70b-versatile",
          "llama-guard-3-8b",
          "llama3-70b-8192",
          "llama3-8b-8192",
          "mixtral-8x7b-32768",
          "qwen-2.5-32b",
          ]
        fetch: false
      titleConvo: true
      titleModel: "llama-3.3-70b-versatile"
      modelDisplayLabel: "groq"

endpoints:
  custom:
    - name: "DuckDuckGo Chat"
      baseURL: "https://duckduckgo.com/duckchat/v1"
      models:
        default: ["gpt-4o-mini", "llama-3.3-70b", "claude-3-haiku", "o3-mini", "mixtral-8x7b"]
        fetch: false
      titleConvo: true
      titleModel: "o3-mini"
      modelDisplayLabel: "DuckDuckGo Chat"
    # ... other endpoints follow here.

    # GitHub
    - name: "Github Models"
      iconURL: https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png
      apiKey: "user_provided"
      baseURL: "https://models.inference.ai.azure.com"
      models:
        default: [
          "gpt-4o",
          "gpt-4o-mini",
          "o1",
          "o1-mini",
          "o1-preview",
          "Llama-3.3-70B-Instruct",
          "Llama-3.2-90B-Vision-Instruct",
          "Llama-3.2-11B-Vision-Instruct",
          "Meta-Llama-3.1-405B-Instruct",
          "Meta-Llama-3.1-70B-Instruct",
          "Meta-Llama-3.1-8B-Instruct",
          "Phi-4",
          "Phi-3.5-MoE-instruct",
          "Phi-3.5-mini-instruct",
          "Phi-3.5-vision-instruct",
          "Ministral-3B",
          "Codestral-2501",
          "Mistral-large-2407",
          "Mistral-large",
          "Mistral-small",
          "Cohere-command-r-plus-08-2024",
          "Cohere-command-r-08-2024",
          "AI21-Jamba-1.5-Large",
          "AI21-Jamba-1.5-Mini"
          ]
        fetch: false
      titleConvo: true
      titleModel: "gpt-4o-mini"

    # NVIDIA
    # https://build.nvidia.com/explore/discover
    - name: "Nvidia"
      apiKey: "user_provided"
      baseURL: "https://integrate.api.nvidia.com/v1/"
      models:
        default: [
          "nvidia/llama-3.1-nemotron-51b-instruct",
          "nvidia/llama-3.1-nemotron-70b-instruct",
          "deepseek-ai/deepseek-r1",
          "nvidia/nemotron-4-340b-instruct",
          ]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-ai/deepseek-r1"
      modelDisplayLabel: "Nvidia"
      iconURL: "https://raw.githubusercontent.com/LibreChat-AI/librechat-config-yaml/refs/heads/main/icons/nvidia.png"

    # OpenRouter.ai
    # Model list: https://openrouter.ai/models
    # Script to fetch models: https://github.com/LibreChat-AI/librechat-config-yaml/blob/main/scripts/openrouter.py
    - name: "OpenRouter"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: [
          "openrouter/auto",
          "---FREE---",
          "deepseek/deepseek-r1:free",
          "google/gemini-2.0-flash-exp:free",
          "google/gemini-2.0-flash-thinking-exp-1219:free",
          "google/gemini-2.0-flash-thinking-exp:free",
          "google/gemini-exp-1114:free",
          "google/gemini-exp-1121:free",
          "google/gemini-exp-1206:free",
          "google/gemma-2-9b-it:free",
          "google/learnlm-1.5-pro-experimental:free",
          "gryphe/mythomax-l2-13b:free",
          "huggingfaceh4/zephyr-7b-beta:free",
          "meta-llama/llama-3-8b-instruct:free",
          "meta-llama/llama-3.1-405b-instruct:free",
          "meta-llama/llama-3.1-70b-instruct:free",
          "meta-llama/llama-3.1-8b-instruct:free",
          "meta-llama/llama-3.2-11b-vision-instruct:free",
          "meta-llama/llama-3.2-1b-instruct:free",
          "meta-llama/llama-3.2-3b-instruct:free",
          "meta-llama/llama-3.2-90b-vision-instruct:free",
          "microsoft/phi-3-medium-128k-instruct:free",
          "microsoft/phi-3-mini-128k-instruct:free",
          "mistralai/mistral-7b-instruct:free",
          "openchat/openchat-7b:free",
          "qwen/qwen-2-7b-instruct:free",
          "sophosympatheia/rogue-rose-103b-v0.2:free",
          "undi95/toppy-m-7b:free"
          ]
        fetch: false
      dropParams: ["stop"]
      titleConvo: true
      titleModel: "deepseek/deepseek-r1:free"
      summarize: false
      summaryModel: "openai/gpt-4o-mini"
      forcePrompt: false
      modelDisplayLabel: "OpenRouter"

    # openai
    - name: "OpenAI"
      apiKey: "user_provided"
      baseURL: "https://api.openai.com/v1"
      models:
        default: ["gpt-4o", "gpt-4-turbo-preview", "gpt-3.5-turbo"]
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "gpt-3.5-turbo"
      summarize: false
      summaryModel: "gpt-3.5-turbo"
      forcePrompt: false
      modelDisplayLabel: "OpenAI"

    # google
    - name: "Google AI"
      apiKey: "user_provided"
      baseURL: "https://generativelanguage.googleapis.com/v1beta"
      models:
        default: [
          "gemini-2.0-pro-exp-02-05",
          "gemini-2.0-flash-thinking-exp-01-21",
          "gemini-2.0-flash-exp",
          "gemini-exp-1206",
          "learnlm-1.5-pro-experimental",
          "gemini-2.0-flash",
          "gemini-2.0-flash-lite-preview-02-05",
          "gemini-1.5-flash",
          "gemini-1.5-flash-8b",
          "gemini-1.5-pro"
          ]
        fetch: false
      titleConvo: true
      titleModel: "gemini-2.0-pro-exp-02-05"
      modelDisplayLabel: "Google AI"
